<!doctype html>

    <script>
      // ========== 主题管理 ==========
      const themeBtn = document.getElementById('btn-theme')
      const sunIcon = document.querySelector('.sun-icon')
      const moonIcon = document.querySelector('.moon-icon')
      const hljsLight = document.getElementById('hljs-light')
      const hljsDark = document.getElementById('hljs-dark')

      function getSystemTheme() {
        if (
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        ) {
          return 'dark'
        }
        return 'light'
      }

      function getCurrentTheme() {
        const saved = localStorage.getItem('theme')
        if (saved) return saved
        return getSystemTheme()
      }

      function applyTheme(theme) {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark')
          sunIcon.classList.add('hidden')
          moonIcon.classList.remove('hidden')
          hljsLight.disabled = true
          hljsDark.disabled = false
        } else {
          document.documentElement.classList.remove('dark')
          sunIcon.classList.remove('hidden')
          moonIcon.classList.add('hidden')
          hljsLight.disabled = false
          hljsDark.disabled = true
        }
      }

      function toggleTheme() {
        const current = getCurrentTheme()
        const newTheme = current === 'dark' ? 'light' : 'dark'
        localStorage.setItem('theme', newTheme)
        applyTheme(newTheme)
      }

      window
        .matchMedia('(prefers-color-scheme: dark)')
        .addEventListener('change', (e) => {
          if (!localStorage.getItem('theme')) {
            applyTheme(e.matches ? 'dark' : 'light')
          }
        })

      applyTheme(getCurrentTheme())
      themeBtn.addEventListener('click', toggleTheme)

      // ========== Markdown-it 初始化 ==========
      const md = window.markdownit({
        html: true,
        linkify: true,
        typographer: true,
        highlight: function (str, lang) {
          if (lang && hljs.getLanguage(lang)) {
            try {
              return (
                '<pre class="hljs"><code>' +
                hljs.highlight(str, { language: lang, ignoreIllegals: true })
                  .value +
                '</code></pre>'
              )
            } catch (__) {}
          }
          return (
            '<pre class="hljs"><code>' +
            md.utils.escapeHtml(str) +
            '</code></pre>'
          )
        },
      })

      // ========== DOM 元素获取 ==========
      const rawInput = document.getElementById('raw-input')
      const btnParse = document.getElementById('btn-parse')
      const btnPlay = document.getElementById('btn-play')
      const presetChatBtn = document.getElementById('preset-chat')
      const presetResponsesBtn = document.getElementById('preset-responses')
      const presetDoubaoBtn = document.getElementById('preset-doubao')
      const reasoningBox = document.getElementById('reasoning-box')
      const reasoningContent = document.getElementById('reasoning-content')
      const toolsBox = document.getElementById('tools-box')
      const errorBox = document.getElementById('error-box')
      const mainContent = document.getElementById('main-content')
      const scrollContainer = document.getElementById('output-scroll-container')

      // ========== 预设演示数据定义 ==========
      // 1. Chat Completions 格式
      const chatCompletionsData = `data: {"id":"chatcmpl-123","object":"chat.completion.chunk","created":1710000000,"model":"gpt-4o","choices":[{"index":0,"delta":{"role":"assistant","content":null,"reasoning_content":"这是一道关于解析 Chat Completions 流式数据的演示。\\n"},"finish_reason":null}]}
data: {"id":"chatcmpl-123","object":"chat.completion.chunk","created":1710000000,"model":"gpt-4o","choices":[{"index":0,"delta":{"reasoning_content":"我们从 \`choices[0].delta.reasoning_content\` 获取思考过程。\\n"},"finish_reason":null}]}
data: {"id":"chatcmpl-123","object":"chat.completion.chunk","created":1710000000,"model":"gpt-4o","choices":[{"index":0,"delta":{"content":"## Chat Completions 格式演示\\n\\n"},"finish_reason":null}]}

      // 2. OpenAI 标准 Responses 格式
      const responsesApiData = `event: response.reasoning.delta

event: response.output_text.delta
data: {"type":"response.output_text.delta","delta":"支持 \`response.output_text.delta\` 与 \`response.reasoning.delta\` 事件。"}

      // 3. 豆包 / 火山引擎 Responses 真实实测（包含 web_search_call 与 ToolNotOpen 报错）
      const doubaoData = `event: response.created
data: {"type":"response.created","response":{"created_at":1785725325,"id":"resp_021785725324484d323cdad39964ab14a5fcc08ad1c3650c2d339","max_output_tokens":32768,"model":"doubao-seed-2-0-mini-260428","object":"response","service_tier":"default","tools":[{"type":"web_search","max_keyword":2}],"caching":{"type":"disabled"},"store":true,"expire_at":1785984524},"sequence_number":0}

data: [DONE]`

      // 默认加载豆包实测数据
      rawInput.value = doubaoData

      // ========== 预设按钮绑定 ==========
      presetChatBtn.addEventListener('click', () => {
        rawInput.value = chatCompletionsData
        resetUI()
        render(chatCompletionsData)
      })

      presetResponsesBtn.addEventListener('click', () => {
        rawInput.value = responsesApiData
        resetUI()
        render(responsesApiData)
      })

      presetDoubaoBtn.addEventListener('click', () => {
        rawInput.value = doubaoData
        resetUI()
        render(doubaoData)
      })

      // ========== UI 重置 ==========
      function resetUI() {
        reasoningBox.classList.add('hidden')
        reasoningContent.innerHTML = ''
        toolsBox.classList.add('hidden')
        toolsBox.innerHTML = ''
        errorBox.classList.add('hidden')
        errorBox.innerHTML = ''
        mainContent.innerHTML = ''
      }

      // ========== 核心解析渲染逻辑 ==========
      function render(textData, isStreaming = false) {
        const lines = textData.split('\n')
        let accumulatedReasoning = ''
        let accumulatedContent = ''
        let errorObj = null
        const toolCallsMap = {} // 存储 web_search_call / function_call
        let currentEvent = ''

        for (let line of lines) {
          const trimmedLine = line.trim()
          if (!trimmedLine) {
            currentEvent = ''
            continue
          }

          if (trimmedLine.startsWith('event:')) {
            currentEvent = trimmedLine.substring(6).trim()
            continue
          }

          if (trimmedLine.startsWith('data:')) {
            const jsonStr = trimmedLine.substring(5).trim()
            if (jsonStr === '[DONE]') break

            try {
              const data = JSON.parse(jsonStr)
              const eventType = data.type || currentEvent
              let matched = false

              // -------------------------------------------------------------
              // A. 错误提取 (error / response.failed)
              // -------------------------------------------------------------
              if (
                eventType === 'error' ||
                eventType === 'response.failed' ||
                data.error ||
                (data.response && data.response.error)
              ) {
                const err =
                  data.error ||
                  (data.response && data.response.error) ||
                  data
                if (err && (err.message || err.code)) {
                  errorObj = {
                    code: err.code || 'UNKNOWN_ERROR',
                    message: err.message || JSON.stringify(err),
                  }
                }
              }

              // -------------------------------------------------------------
              // B. 工具调用提取 (web_search_call / function_call 等)
              // -------------------------------------------------------------
              if (
                eventType &&
                (eventType.includes('output_item') ||
                  eventType.includes('call') ||
                  eventType.includes('tool'))
              ) {
                const item =
                  data.item ||
                  (data.response &&
                    data.response.output &&
                    data.response.output.find(
                      (i) => i.type && i.type.includes('call')
                    )) ||
                  null

                const itemId =
                  data.item_id ||
                  (item && item.id) ||
                  data.id ||
                  'tool_' + (data.output_index ?? 0)

                if (item || eventType.includes('call')) {
                  if (!toolCallsMap[itemId]) {
                    toolCallsMap[itemId] = {
                      id: itemId,
                      type: (item && item.type) || 'tool_call',
                      status: 'in_progress',
                      action: null,
                    }
                  }
                  const tc = toolCallsMap[itemId]
                  if (item) {
                    if (item.type) tc.type = item.type
                    if (item.status) tc.status = item.status
                    if (item.action) tc.action = item.action
                  }
                  if (
                    eventType.includes('searching') ||
                    eventType.includes('in_progress')
                  )
                    tc.status = 'in_progress'
                  if (
                    eventType.includes('completed') ||
                    eventType.includes('done')
                  )
                    tc.status = 'completed'
                  if (eventType.includes('failed')) tc.status = 'failed'
                }
              }

              // -------------------------------------------------------------
              // C. Reasoning (思考过程/摘要) 解析
              // 支持: response.reasoning_summary_text.delta / done / response.reasoning.delta
              // -------------------------------------------------------------
              if (eventType && eventType.includes('reasoning')) {
                if (eventType.includes('delta')) {
                  const rText =
                    data.delta ||
                    data.text ||
                    (typeof data.content === 'string' ? data.content : '')
                  if (rText) {
                    accumulatedReasoning += rText
                    matched = true
                  }
                } else if (
                  eventType.endsWith('.done') ||
                  eventType.includes('done')
                ) {
                  // 如果存在 .done 事件（包含完整的 text 汇总），若当前拼接内容较短则补充修正
                  const fullText =
                    data.text ||
                    (data.part && data.part.text) ||
                    (data.item &&
                      data.item.summary &&
                      data.item.summary[0] &&
                      data.item.summary[0].text)
                  if (fullText && fullText.length > accumulatedReasoning.length) {
                    accumulatedReasoning = fullText
                    matched = true
                  }
                }
              }

              // -------------------------------------------------------------
              // D. Output Text (正文内容) 解析
              // -------------------------------------------------------------
              if (
                !matched &&
                eventType &&
                (eventType.endsWith('.delta') || eventType.includes('delta'))
              ) {
                if (
                  eventType.includes('output_text') ||
                  eventType.includes('text') ||
                  eventType.includes('content') ||
                  eventType.includes('message')
                ) {
                  const cText =
                    data.delta ||
                    data.text ||
                    (typeof data.content === 'string' ? data.content : '')
                  if (cText) {
                    accumulatedContent += cText
                    matched = true
                  }
                }
              }

              // -------------------------------------------------------------
              // E. Chat Completions 协议兼容 (choices[0].delta)
              // -------------------------------------------------------------
              if (!matched && data.choices && data.choices[0]) {
                const choice = data.choices[0]
                const delta = choice.delta || choice

                if (delta.reasoning_content) {
                  accumulatedReasoning += delta.reasoning_content
                  matched = true
                } else if (delta.reasoning) {
                  accumulatedReasoning += delta.reasoning
                  matched = true
                }

                if (delta.content) {
                  accumulatedContent += delta.content
                  matched = true
                } else if (typeof delta.text === 'string' && !eventType) {
                  accumulatedContent += delta.text
                  matched = true
                }
              }

              // -------------------------------------------------------------
              // F. 通用兜底
              // -------------------------------------------------------------
              if (!matched && !eventType) {
                if (data.reasoning_content || data.reasoning) {
                  accumulatedReasoning +=
                    data.reasoning_content || data.reasoning
                }
                if (data.content && typeof data.content === 'string') {
                  accumulatedContent += data.content
                } else if (data.delta && typeof data.delta === 'string') {
                  accumulatedContent += data.delta
                }
              }
            } catch (e) {
              console.warn('解析 JSON 失败，跳过此行:', line)
            }
          }
        }

        // ================= 视图渲染 =================

        // 1. 渲染思考过程
        if (accumulatedReasoning) {
          reasoningBox.classList.remove('hidden')
          reasoningContent.innerHTML = md.render(accumulatedReasoning)
        } else {
          reasoningBox.classList.add('hidden')
        }

        // 2. 渲染工具调用 (Web Search / Function Call)
        const toolList = Object.values(toolCallsMap)
        if (toolList.length > 0) {
          toolsBox.classList.remove('hidden')
          toolsBox.innerHTML = `
            <div class="font-semibold text-blue-700 dark:text-blue-300 flex items-center gap-1.5 mb-2.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
              </svg>
              <span>工具调用 / 联网搜索列表 (${toolList.length})</span>
            </div>
            <div class="flex flex-col gap-2">
              ${toolList
                .map((t) => {
                  const queryStr = t.action
                    ? t.action.query || JSON.stringify(t.action)
                    : '检索执行中...'
                  let statusBadge = ''
                  if (t.status === 'completed') {
                    statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-300">已完成</span>`
                  } else if (t.status === 'failed') {
                    statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300">失败</span>`
                  } else {
                    statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 animate-pulse">进行中...</span>`
                  }

                  return `
                  <div class="bg-white dark:bg-gray-800 border border-blue-100 dark:border-blue-900/40 p-2.5 rounded-lg flex items-center justify-between">
                    <div class="flex items-center gap-2 overflow-hidden mr-2">
                      <span class="px-2 py-0.5 rounded font-mono font-bold bg-blue-100 dark:bg-blue-900/60 text-blue-800 dark:text-blue-200 text-[11px] flex-shrink-0">
                        ${t.type}
                      </span>
                      <span class="text-gray-700 dark:text-gray-200 font-mono text-xs truncate">
                        ${md.utils.escapeHtml(queryStr)}
                      </span>
                    </div>
                    ${statusBadge}
                  </div>
                `
                })
                .join('')}
            </div>
          `
        } else {
          toolsBox.classList.add('hidden')
        }

        // 3. 渲染错误面板
        if (errorObj) {
          errorBox.classList.remove('hidden')
          errorBox.innerHTML = `
            <div class="flex items-center gap-2 font-semibold text-red-700 dark:text-red-400 mb-1.5">
              <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span>接口请求异常 (${md.utils.escapeHtml(errorObj.code)})</span>
            </div>
            <div class="text-red-600 dark:text-red-300 font-mono text-xs leading-relaxed break-all bg-red-100/50 dark:bg-red-900/30 p-2.5 rounded border border-red-200 dark:border-red-800/40">
              ${md.utils.escapeHtml(errorObj.message)}
            </div>
          `
        } else {
          errorBox.classList.add('hidden')
        }

        // 4. 渲染正文内容
        if (accumulatedContent) {
          mainContent.innerHTML = md.render(accumulatedContent)
        } else if (errorObj || toolList.length > 0) {
          mainContent.innerHTML = ''
        } else {
          mainContent.innerHTML =
            '<div class="text-gray-400 dark:text-gray-500 italic mt-10 text-center">左侧输入数据，点击上方按钮开始解析...</div>'
        }

        // 流式输出自动滚动到底部
        if (isStreaming) {
          scrollContainer.scrollTop = scrollContainer.scrollHeight
        }
      }

      // 瞬间一键解析
      btnParse.addEventListener('click', () => {
        resetUI()
        render(rawInput.value)
      })

      // 模拟真实流式播放
      btnPlay.addEventListener('click', async () => {
        resetUI()
        const textData = rawInput.value
        const lines = textData.split('\n')

        btnPlay.disabled = true
        btnPlay.classList.add('opacity-50', 'cursor-not-allowed')

        let currentStreamText = ''
        for (let i = 0; i < lines.length; i++) {
          currentStreamText += lines[i] + '\n'
          render(currentStreamText, true)

          await new Promise((resolve) => setTimeout(resolve, 30))
        }

        btnPlay.disabled = false
        btnPlay.classList.remove('opacity-50', 'cursor-not-allowed')
      })

      // 初始化一键渲染默认数据
      render(doubaoData)
    </script>
  </body>
</html>
