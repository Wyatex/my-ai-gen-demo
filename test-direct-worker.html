<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="output">Testing...</div>
<script>
const out = document.getElementById('output');
function log(msg) {
  out.innerHTML += '<br>' + msg;
  console.log(msg);
}

(async () => {
  try {
    log('1. Testing worker creation...');
    const workerUrl = '/assets/@ffmpeg/core-mt@0.12.6/dist/esm/ffmpeg-core.worker.js';
    
    log('1.1 Creating classic Worker with HTTP URL: ' + workerUrl);
    const w1 = new Worker(workerUrl);
    w1.onerror = (e) => log('w1 onerror: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
    w1.onmessage = (e) => log('w1 onmessage: ' + JSON.stringify(e.data));

    log('1.2 Creating module Worker with HTTP URL: ' + workerUrl);
    try {
      const w2 = new Worker(workerUrl, { type: 'module' });
      w2.onerror = (e) => log('w2 onerror: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
      w2.onmessage = (e) => log('w2 onmessage: ' + JSON.stringify(e.data));
    } catch(err) {
      log('w2 error creating: ' + err.message);
    }

    const workerRes = await fetch(workerUrl);
    const workerBlob = await workerRes.blob();
    const blobUrl = URL.createObjectURL(workerBlob);
    log('1.3 Creating classic Worker with Blob URL: ' + blobUrl);
    const w3 = new Worker(blobUrl);
    w3.onerror = (e) => log('w3 onerror: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
    w3.onmessage = (e) => log('w3 onmessage: ' + JSON.stringify(e.data));

    setTimeout(() => {
      log('Sending test message to w1, w3...');
      w1.postMessage({ cmd: 'test' });
      w3.postMessage({ cmd: 'test' });
    }, 500);

    await new Promise(r => setTimeout(r, 2000));
    log('Done testing worker creation.');
  } catch (err) {
    log('Exception: ' + err.message);
  }
})();
</script>
</body>
</html>
